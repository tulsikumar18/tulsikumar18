<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <style>
      .pipeline-stage {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        cursor: pointer;
      }
      .pipeline-stage:hover {
        transform: translateY(-5px) scale(1.1);
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.9));
      }
    </style>

    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="156" rx="12" fill="url(#tf-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Live Ambient Light Particles in Background -->
  <circle cx="200" cy="40" r="60" fill="#38bdf8" opacity="0.05" filter="url(#glow-light)">
    <animate attributeName="cx" values="200;700;200" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Section Title -->
  <text x="30" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">END-TO-END AI / LLM / RAG PIPELINE ENGINE</text>

  <!-- Connecting Pipeline Axis -->
  <path d="M 90 90 L 810 90" stroke="url(#line-grad)" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Stage 1: Ingestion -->
  <g class="pipeline-stage" transform="translate(90, 90)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow-light)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#38bdf8">📄</text>
    <text y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Ingestion</text>
    <text y="58" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">PDF, HTML, Audio</text>
  </g>

  <!-- Stage 2: Parsing -->
  <g class="pipeline-stage" transform="translate(270, 90)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#00f5a0" stroke-width="2"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#00f5a0">⚙️</text>
    <text y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">2. Parsing</text>
    <text y="58" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">BS4, OCR, OpenCV</text>
  </g>

  <!-- Stage 3: Embeddings -->
  <g class="pipeline-stage" transform="translate(450, 90)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" filter="url(#glow-light)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle" fill="#818cf8">🧠</text>
    <text y="50" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">3. Embeddings</text>
    <text y="62" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FAISS &amp; Neo4j Graph</text>
  </g>

  <!-- Stage 4: RAG / LLM -->
  <g class="pipeline-stage" transform="translate(630, 90)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#c084fc">🤖</text>
    <text y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">4. RAG / LLM</text>
    <text y="58" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">FastAPI &amp; Gemini</text>
  </g>

  <!-- Stage 5: Delivery -->
  <g class="pipeline-stage" transform="translate(810, 90)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#00d2ff" stroke-width="2" filter="url(#glow-light)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#00d2ff">🚀</text>
    <text y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">5. Delivery</text>
    <text y="58" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">JSON, Dash &amp; Push</text>
  </g>

  <!-- Moving Data Pulses -->
  <circle cx="90" cy="90" r="4" fill="#38bdf8" filter="url(#glow-light)">
    <animate attributeName="cx" values="90;270;450;630;810" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
