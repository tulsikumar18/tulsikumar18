<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Text Glow Gradients -->
    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect x="2" y="2" width="896" height="196" rx="14" fill="url(#hero-bg)" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Left: Developer Terminal -->
  <g transform="translate(24, 24)">
    <!-- Terminal Header -->
    <rect x="0" y="0" width="480" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="13" r="5" fill="#ff5f56"/>
    <circle cx="28" cy="13" r="5" fill="#ffbd2e"/>
    <circle cx="42" cy="13" r="5" fill="#27c93f"/>
    <text x="240" y="17" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">tulsi@dev-workstation: ~ (zsh)</text>

    <!-- Terminal Body -->
    <rect x="0" y="26" width="480" height="120" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

    <!-- Line 1: Command -->
    <text x="18" y="54" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">
      <tspan fill="#38bdf8">tulsi@dev</tspan>:<tspan fill="#818cf8">~</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#f0883e">whoami</tspan>
    </text>

    <!-- Line 2: Output Name -->
    <text x="18" y="78" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="800" fill="url(#title-glow)" filter="url(#glow)">
      Tulsi Kumar Yadav
    </text>

    <!-- Line 3: Position -->
    <text x="18" y="100" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">
      Software Engineer • AI/ML • RAG • Backend
    </text>

    <!-- Line 4: Active prompt + Blinking cursor -->
    <text x="18" y="124" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">
      <tspan fill="#00f5a0">&gt;</tspan> <tspan fill="#e6edf3">building intelligent systems</tspan>
    </text>
    <rect x="238" y="112" width="7" height="14" fill="#00f5a0" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right: Architecture Data Flow Visualization -->
  <g transform="translate(530, 24)">
    <rect x="0" y="0" width="345" height="146" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">SYSTEM DOMAIN FLOW</text>

    <!-- Connection Paths -->
    <path d="M 60 70 L 120 70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 190 70 L 250 70" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Node 1: AI / ML -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="45" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="22.5" y="22" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#38bdf8">🤖</text>
      <text x="22.5" y="36" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">AI/ML</text>
    </g>

    <!-- Node 2: LLM & RAG -->
    <g transform="translate(120, 48)">
      <rect x="0" y="0" width="70" height="44" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>
      <text x="35" y="22" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#818cf8">🔎</text>
      <text x="35" y="36" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#818cf8" text-anchor="middle">LLM &amp; RAG</text>
    </g>

    <!-- Node 3: Backend APIs -->
    <g transform="translate(250, 48)">
      <rect x="0" y="0" width="78" height="44" rx="8" fill="#1e293b" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="39" y="22" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#00f5a0">⚡</text>
      <text x="39" y="36" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#00f5a0" text-anchor="middle">FastAPI DB</text>
    </g>

    <!-- Moving Data Particles -->
    <circle cx="60" cy="70" r="3" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="cx" values="60;120" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="70" r="3" fill="#00f5a0" filter="url(#glow)">
      <animate attributeName="cx" values="190;250" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom Status Text -->
    <text x="172.5" y="125" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" text-anchor="middle">Production AI Applications</text>
  </g>
</svg>
