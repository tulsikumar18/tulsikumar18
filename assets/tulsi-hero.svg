  <circle cx="830" cy="65" r="115" stroke="#C77B9B" stroke-opacity=".18"/>
  <circle cx="830" cy="65" r="82" stroke="#C77B9B" stroke-opacity=".22"/>
  <circle cx="830" cy="65" r="49" stroke="#E5B5C7" stroke-opacity=".25"/>

