<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <style>
      .node-card {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        cursor: pointer;
      }
      .node-card:hover {
        transform: translateY(-4px);
        filter: drop-shadow(0 6px 16px rgba(0, 242, 254, 0.45));
      }
      .node-card:hover rect {
        stroke: #00f2fe !important;
        stroke-width: 2px !important;
        fill: #1e293b !important;
      }
      .tag-card {
        transition: transform 0.25s ease, filter 0.25s ease;
        cursor: pointer;
      }
      .tag-card:hover {
        transform: translateY(-2px);
        filter: drop-shadow(0 4px 10px rgba(0, 245, 160, 0.5));
      }
      .title-text {
        transition: filter 0.3s ease;
      }
      .title-text:hover {
        filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8));
      }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="pb-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#7f00ff;#00f5a0;#00f2fe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f5a0;#00f2fe;#7f00ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f5a0">
        <animate attributeName="stop-color" values="#00f5a0;#00f2fe;#7f00ff;#00f5a0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Animated Title Gradient -->
    <linearGradient id="pb-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="pb-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="pb-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="30" cy="0" r="1" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="pb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pb-strong-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="246" rx="16" fill="url(#pb-bg)" stroke="url(#pb-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="246" rx="16" fill="url(#pb-grid)"/>

  <!-- Live Dynamic Ambient Background Glow Orbs -->
  <circle cx="150" cy="50" r="100" fill="#38bdf8" opacity="0.08" filter="url(#pb-strong-glow)">
    <animate attributeName="cx" values="150;220;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;90;50" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="750" cy="180" r="110" fill="#7f00ff" opacity="0.08" filter="url(#pb-strong-glow)">
    <animate attributeName="cx" values="750;680;750" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;130;180" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Scanning Laser Line across top -->
  <line x1="0" y1="4" x2="300" y2="4" stroke="url(#laser-grad)" stroke-width="2" opacity="0.8">
    <animate attributeName="x1" values="-300;900" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Tech Corner Markers -->
  <path d="M 20 36 L 20 20 L 36 20" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 880 36 L 880 20 L 864 20" stroke="#7f00ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 20 214 L 20 230 L 36 230" stroke="#00f5a0" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 880 214 L 880 230 L 864 230" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Left Side: Profile Info -->
  <!-- Status Badge -->
  <g transform="translate(42, 34)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="13" r="4" fill="#00f5a0" filter="url(#pb-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AI &amp; BACKEND ENGINEER</text>
  </g>

  <!-- Name Title -->
  <g class="title-text">
    <text x="42" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="url(#pb-title)" letter-spacing="0.5">TULSI KUMAR YADAV</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="42" y="130" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#94a3b8">
    Software Engineer <tspan fill="#38bdf8">•</tspan> AI/ML &amp; RAG Developer
  </text>

  <!-- Domain Tags (Interactive Hover) -->
  <g transform="translate(42, 160)">
    <g class="tag-card">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">🤖 LLM / RAG</text>
    </g>

    <g class="tag-card" transform="translate(110, 0)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#00f5a0">⚡ FastAPI &amp; DB</text>
    </g>

    <g class="tag-card" transform="translate(230, 0)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#c084fc">🧠 Graph &amp; CV</text>
    </g>
  </g>

  <!-- Right Side: Interactive System Architecture Graph -->
  <g transform="translate(440, 26)">
    <!-- Container Card -->
    <rect x="0" y="0" width="420" height="195" rx="12" fill="url(#pb-card)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">SYSTEM ARCHITECTURE PIPELINE</text>

    <!-- Connecting Circuit Paths -->
    <path d="M 75 72 L 130 72" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 205 72 L 255 72" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <path d="M 320 94 L 320 135 L 320 135" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <path d="M 130 135 L 75 135" stroke="#00f5a0" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Nodes (With CSS Hover Interactivity) -->
    <!-- Node 1: Python -->
    <g class="node-card" transform="translate(16, 50)">
      <rect x="0" y="0" width="58" height="44" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="29" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Python</text>
      <text x="29" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Core</text>
    </g>

    <!-- Node 2: FastAPI -->
    <g class="node-card" transform="translate(130, 50)">
      <rect x="0" y="0" width="75" height="44" rx="8" fill="#0f172a" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="37.5" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">FastAPI</text>
      <text x="37.5" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">REST APIs</text>
    </g>

    <!-- Node 3: LLMs & RAG -->
    <g class="node-card" transform="translate(255, 50)">
      <animateTransform attributeName="transform" type="translate" values="255,50; 255,47; 255,50" dur="3s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="135" height="44" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" filter="url(#pb-glow)"/>
      <text x="67.5" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">LLMs &amp; RAG</text>
      <text x="67.5" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Transformers</text>
    </g>

    <!-- Node 4: AI Apps -->
    <g class="node-card" transform="translate(16, 113)">
      <rect x="0" y="0" width="58" height="44" rx="8" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="29" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">AI Apps</text>
      <text x="29" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Deploy</text>
    </g>

    <!-- Node 5: FAISS & Neo4j -->
    <g class="node-card" transform="translate(130, 113)">
      <rect x="0" y="0" width="260" height="44" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="130" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">FAISS &amp; Neo4j &amp; Supabase</text>
      <text x="130" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Vector Search &amp; Knowledge Graph</text>
    </g>

    <!-- Moving Data Particles -->
    <circle cx="75" cy="72" r="3.5" fill="#00f2fe" filter="url(#pb-glow)">
      <animate attributeName="cx" values="75;130" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="72" r="3.5" fill="#818cf8" filter="url(#pb-glow)">
      <animate attributeName="cx" values="205;255" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="135" r="3.5" fill="#00f5a0" filter="url(#pb-glow)">
      <animate attributeName="cx" values="200;75" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
