<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <style>
      .stage-3d {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        cursor: pointer;
      }
      .stage-3d:hover {
        transform: translateY(-8px) scale(1.1);
        filter: drop-shadow(0 10px 20px rgba(56, 189, 248, 0.85));
      }
    </style>

    <linearGradient id="bg-arch-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>

    <linearGradient id="line-3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <pattern id="arch-iso-grid" width="40" height="23.09" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 11.55 L 20 23.09 L 0 11.55 Z" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.3"/>
    </pattern>

    <filter id="glow-arch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#bg-arch-3d)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#arch-iso-grid)"/>

  <!-- Live Ambient Light Particles -->
  <circle cx="150" cy="90" r="80" fill="#38bdf8" opacity="0.06" filter="url(#glow-arch)">
    <animate attributeName="cx" values="150;750;150" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Section Title -->
  <text x="30" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">3D END-TO-END AI / LLM / RAG PIPELINE ENGINE</text>

  <!-- Connecting Pipeline Axis -->
  <path d="M 90 95 L 810 95" stroke="url(#line-3d)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- 3D Stage 1: Ingestion -->
  <g class="stage-3d" transform="translate(90, 95)">
    <!-- 3D Base Shadow -->
    <ellipse cx="0" cy="36" rx="28" ry="10" fill="#060911" opacity="0.8"/>
    <!-- 3D Polygon Cube Top -->
    <polygon points="0,-32 24,-18 0,-4 -24,-18" fill="#38bdf8" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="-24,-18 0,-4 0,16 -24,2" fill="#0284c7"/>
    <!-- Right Face -->
    <polygon points="0,-4 24,-18 24,2 0,16" fill="#0369a1"/>
    <text cx="0" cy="2" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#ffffff">📄</text>
    <text y="52" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Ingestion</text>
    <text y="64" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">PDF, HTML, Audio</text>
  </g>

  <!-- 3D Stage 2: Parsing -->
  <g class="stage-3d" transform="translate(270, 95)">
    <ellipse cx="0" cy="36" rx="28" ry="10" fill="#060911" opacity="0.8"/>
    <polygon points="0,-32 24,-18 0,-4 -24,-18" fill="#00f5a0" opacity="0.9"/>
    <polygon points="-24,-18 0,-4 0,16 -24,2" fill="#059669"/>
    <polygon points="0,-4 24,-18 24,2 0,16" fill="#047857"/>
    <text cx="0" cy="2" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#ffffff">⚙️</text>
    <text y="52" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">2. Parsing</text>
    <text y="64" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">BS4, OCR, OpenCV</text>
  </g>

  <!-- 3D Stage 3: Embeddings -->
  <g class="stage-3d" transform="translate(450, 95)">
    <ellipse cx="0" cy="40" rx="32" ry="12" fill="#060911" opacity="0.8"/>
    <polygon points="0,-36 28,-20 0,-4 -28,-20" fill="#818cf8" opacity="0.95" filter="url(#glow-arch)"/>
    <polygon points="-28,-20 0,-4 0,18 -28,2" fill="#4f46e5"/>
    <polygon points="0,-4 28,-20 28,2 0,18" fill="#4338ca"/>
    <text cx="0" cy="2" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#ffffff">🧠</text>
    <text y="54" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">3. Embeddings</text>
    <text y="66" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FAISS &amp; Neo4j Graph</text>
  </g>

  <!-- 3D Stage 4: RAG / LLM -->
  <g class="stage-3d" transform="translate(630, 95)">
    <ellipse cx="0" cy="36" rx="28" ry="10" fill="#060911" opacity="0.8"/>
    <polygon points="0,-32 24,-18 0,-4 -24,-18" fill="#c084fc" opacity="0.9"/>
    <polygon points="-24,-18 0,-4 0,16 -24,2" fill="#9333ea"/>
    <polygon points="0,-4 24,-18 24,2 0,16" fill="#7e22ce"/>
    <text cx="0" cy="2" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#ffffff">🤖</text>
    <text y="52" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">4. RAG / LLM</text>
    <text y="64" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">FastAPI &amp; Gemini</text>
  </g>

  <!-- 3D Stage 5: Delivery -->
  <g class="stage-3d" transform="translate(810, 95)">
    <ellipse cx="0" cy="36" rx="28" ry="10" fill="#060911" opacity="0.8"/>
    <polygon points="0,-32 24,-18 0,-4 -24,-18" fill="#00d2ff" opacity="0.9"/>
    <polygon points="-24,-18 0,-4 0,16 -24,2" fill="#0284c7"/>
    <polygon points="0,-4 24,-18 24,2 0,16" fill="#0369a1"/>
    <text cx="0" cy="2" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#ffffff">🚀</text>
    <text y="52" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">5. Delivery</text>
    <text y="64" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">JSON, Dash &amp; Push</text>
  </g>

  <!-- 3D Moving Data Particles -->
  <circle cx="90" cy="95" r="4.5" fill="#38bdf8" filter="url(#glow-arch)">
    <animate attributeName="cx" values="90;270;450;630;810" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
