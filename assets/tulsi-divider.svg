
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="42" viewBox="0 0 1000 42" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1000" y2="0">
      <stop stop-color="#10070C" stop-opacity="0"/>
      <stop offset=".5" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="180" y2="0">
      <stop stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M0 21H1000" stroke="url(#base)" stroke-width="2"/>

  <path d="M0 21H180" stroke="url(#glow)" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
      values="-180 0;1000 0;-180 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <path d="M500 7L514 21L500 35L486 21Z" stroke="#C77B9B" stroke-width="1.5" fill="#451126"/>
  <circle cx="500" cy="21" r="4" fill="#E5B5C7">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="450" cy="21" r="2" fill="#701A3D"/>
  <circle cx="550" cy="21" r="2" fill="#701A3D"/>
</svg>
