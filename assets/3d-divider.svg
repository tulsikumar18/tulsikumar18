<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="100%">
  <defs>
    <linearGradient id="div-3d-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00f5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>

    <filter id="div-3d-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3D Divider Lines -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#div-3d-grad)" stroke-width="2" filter="url(#div-3d-glow)"/>

  <!-- Rotating 3D Diamond Octahedron -->
  <g transform="translate(450, 12)">
    <g transform="scale(1.2)">
      <!-- Top Pyramid Face Left -->
      <polygon points="0,-8 -6,0 0,0" fill="#38bdf8" opacity="0.9"/>
      <!-- Top Pyramid Face Right -->
      <polygon points="0,-8 6,0 0,0" fill="#818cf8" opacity="0.9"/>
      <!-- Bottom Pyramid Face Left -->
      <polygon points="0,8 -6,0 0,0" fill="#0284c7" opacity="0.9"/>
      <!-- Bottom Pyramid Face Right -->
      <polygon points="0,8 6,0 0,0" fill="#4f46e5" opacity="0.9"/>
    </g>
    <!-- Pulsing Center Core -->
    <circle cx="0" cy="0" r="2" fill="#00f5a0" filter="url(#div-3d-glow)">
      <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
