<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="100%">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00f5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>

    <filter id="div-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Divider Line -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#div-grad)" stroke-width="1.5" filter="url(#div-glow)"/>

  <!-- Center Diamond Element -->
  <g transform="translate(450, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#7f00ff" stroke="#00f2fe" stroke-width="1.5" filter="url(#div-glow)"/>
    <circle cx="0" cy="0" r="2" fill="#00f5a0"/>
  </g>
</svg>
