<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <filter id="foot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <line x1="60" y1="15" x2="350" y2="15" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="550" y1="15" x2="840" y2="15" stroke="#1e293b" stroke-width="1.5"/>

    <text x="450" y="19" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="url(#foot-grad)" text-anchor="middle" letter-spacing="3">
      BUILD • LEARN • SOLVE
    </text>
  </g>
</svg>
