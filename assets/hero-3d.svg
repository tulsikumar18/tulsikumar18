<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    <style>
      .node-3d {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        cursor: pointer;
      }
      .node-3d:hover {
        transform: translateY(-6px) scale(1.03);
        filter: drop-shadow(0 12px 24px rgba(0, 242, 254, 0.55));
      }
      .node-3d:hover rect.front-face {
        stroke: #00f2fe !important;
        stroke-width: 2px !important;
        fill: #1e293b !important;
      }
      .cube-spin-1 {
        transform-origin: 100px 50px;
        animation: spinCube1 12s linear infinite;
      }
      .cube-spin-2 {
        transform-origin: 820px 210px;
        animation: spinCube2 14s linear infinite;
      }
      @keyframes spinCube1 {
        0% { transform: rotate(0deg) translateY(0px); }
        50% { transform: rotate(180deg) translateY(-8px); }
        100% { transform: rotate(360deg) translateY(0px); }
      }
      @keyframes spinCube2 {
        0% { transform: rotate(360deg) translateY(0px); }
        50% { transform: rotate(180deg) translateY(-10px); }
        100% { transform: rotate(0deg) translateY(0px); }
      }
      .tag-3d {
        transition: transform 0.25s ease, filter 0.25s ease;
        cursor: pointer;
      }
      .tag-3d:hover {
        transform: translateY(-3px);
        filter: drop-shadow(0 6px 12px rgba(0, 245, 160, 0.6));
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- 3D Border Gradient -->
    <linearGradient id="border-3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#7f00ff;#00f5a0;#00f2fe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7f00ff">
        <animate attributeName="stop-color" values="#7f00ff;#00f5a0;#00f2fe;#7f00ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f5a0">
        <animate attributeName="stop-color" values="#00f5a0;#00f2fe;#7f00ff;#00f5a0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 3D Isometric Grid Pattern -->
    <pattern id="iso-grid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
      <path d="M 30 0 L 30 34.64" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.2"/>
      <circle cx="30" cy="17.32" r="1.5" fill="#38bdf8" opacity="0.4"/>
    </pattern>

    <!-- Laser Scanning Beam -->
    <linearGradient id="laser-3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strong-glow-3d" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with 3D Border -->
  <rect x="2" y="2" width="896" height="266" rx="16" fill="url(#bg-3d)" stroke="url(#border-3d)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="266" rx="16" fill="url(#iso-grid)"/>

  <!-- Live 3D Ambient Orbs -->
  <circle cx="160" cy="60" r="110" fill="#38bdf8" opacity="0.08" filter="url(#strong-glow-3d)">
    <animate attributeName="cx" values="160;240;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;110;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="200" r="120" fill="#7f00ff" opacity="0.08" filter="url(#strong-glow-3d)">
    <animate attributeName="cx" values="740;660;740" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;140;200" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Rotating 3D Cubes in Background -->
  <!-- 3D Cube 1 (Top Left) -->
  <g class="cube-spin-1">
    <!-- Top Face -->
    <polygon points="100,35 120,45 100,55 80,45" fill="#38bdf8" opacity="0.7"/>
    <!-- Left Face -->
    <polygon points="80,45 100,55 100,75 80,65" fill="#0284c7" opacity="0.7"/>
    <!-- Right Face -->
    <polygon points="100,55 120,45 120,65 100,75" fill="#0369a1" opacity="0.7"/>
  </g>

  <!-- 3D Cube 2 (Bottom Right) -->
  <g class="cube-spin-2">
    <polygon points="820,195 840,205 820,215 800,205" fill="#c084fc" opacity="0.7"/>
    <polygon points="800,205 820,215 820,235 800,225" fill="#9333ea" opacity="0.7"/>
    <polygon points="820,215 840,205 840,225 820,235" fill="#7e22ce" opacity="0.7"/>
  </g>

  <!-- Scanning Laser Beam -->
  <line x1="0" y1="4" x2="350" y2="4" stroke="url(#laser-3d)" stroke-width="2.5" opacity="0.9">
    <animate attributeName="x1" values="-350;900" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1250" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <!-- Corner 3D Hardware Accents -->
  <path d="M 20 36 L 20 20 L 36 20" stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 880 36 L 880 20 L 864 20" stroke="#7f00ff" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 20 234 L 20 250 L 36 250" stroke="#00f5a0" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 880 234 L 880 250 L 864 250" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Left: Profile Info Panel -->
  <g transform="translate(42, 36)">
    <!-- Status Pill with 3D Glow -->
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" filter="url(#glow-3d)"/>
    <circle cx="14" cy="13" r="4" fill="#00f5a0" filter="url(#glow-3d)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AI &amp; BACKEND ENGINEER</text>

    <!-- Name Title -->
    <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="url(#title-3d)" letter-spacing="0.5">TULSI KUMAR YADAV</text>

    <!-- Tagline -->
    <text x="0" y="104" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#94a3b8">
      Software Engineer <tspan fill="#38bdf8">•</tspan> AI/ML &amp; RAG Developer
    </text>

    <!-- 3D Interactive Domain Tags -->
    <g transform="translate(0, 136)">
      <g class="tag-3d">
        <!-- 3D Extrusion Layer -->
        <rect x="2" y="3" width="100" height="26" rx="6" fill="#090d16"/>
        <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">🤖 LLM / RAG</text>
      </g>

      <g class="tag-3d" transform="translate(112, 0)">
        <rect x="2" y="3" width="110" height="26" rx="6" fill="#090d16"/>
        <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#00f5a0" stroke-width="1"/>
        <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#00f5a0">⚡ FastAPI &amp; DB</text>
      </g>

      <g class="tag-3d" transform="translate(234, 0)">
        <rect x="2" y="3" width="110" height="26" rx="6" fill="#090d16"/>
        <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="12" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#c084fc">🧠 Graph &amp; CV</text>
      </g>
    </g>
  </g>

  <!-- Right: 3D System Architecture Pipeline -->
  <g transform="translate(440, 30)">
    <!-- 3D Depth Card Box -->
    <rect x="3" y="4" width="420" height="205" rx="14" fill="#060911"/>
    <rect x="0" y="0" width="420" height="205" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">3D SYSTEM ARCHITECTURE PIPELINE</text>

    <!-- Connecting Circuit Paths -->
    <path d="M 75 76 L 130 76" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 205 76 L 255 76" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 320 98 L 320 142" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 142 L 75 142" stroke="#00f5a0" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Nodes with 3D Depth Extrusions -->
    <!-- Node 1: Python -->
    <g class="node-3d" transform="translate(16, 54)">
      <rect x="2" y="3" width="58" height="44" rx="8" fill="#060911"/>
      <rect class="front-face" x="0" y="0" width="58" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="29" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Python</text>
      <text x="29" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Core</text>
    </g>

    <!-- Node 2: FastAPI -->
    <g class="node-3d" transform="translate(130, 54)">
      <rect x="2" y="3" width="75" height="44" rx="8" fill="#060911"/>
      <rect class="front-face" x="0" y="0" width="75" height="44" rx="8" fill="#1e293b" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="37.5" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">FastAPI</text>
      <text x="37.5" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">REST APIs</text>
    </g>

    <!-- Node 3: LLMs & RAG (Floating Animation) -->
    <g class="node-3d" transform="translate(255, 54)">
      <animateTransform attributeName="transform" type="translate" values="255,54; 255,50; 255,54" dur="3s" repeatCount="indefinite"/>
      <rect x="2" y="3" width="135" height="44" rx="8" fill="#060911"/>
      <rect class="front-face" x="0" y="0" width="135" height="44" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#glow-3d)"/>
      <text x="67.5" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">LLMs &amp; RAG</text>
      <text x="67.5" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Transformers</text>
    </g>

    <!-- Node 4: AI Apps -->
    <g class="node-3d" transform="translate(16, 120)">
      <rect x="2" y="3" width="58" height="44" rx="8" fill="#060911"/>
      <rect class="front-face" x="0" y="0" width="58" height="44" rx="8" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="29" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">AI Apps</text>
      <text x="29" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Deploy</text>
    </g>

    <!-- Node 5: FAISS & Neo4j -->
    <g class="node-3d" transform="translate(130, 120)">
      <rect x="2" y="3" width="260" height="44" rx="8" fill="#060911"/>
      <rect class="front-face" x="0" y="0" width="260" height="44" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="130" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">FAISS &amp; Neo4j &amp; Supabase</text>
      <text x="130" y="33" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">Vector Search &amp; Knowledge Graph</text>
    </g>

    <!-- 3D Moving Data Pulses -->
    <circle cx="75" cy="76" r="4" fill="#00f2fe" filter="url(#glow-3d)">
      <animate attributeName="cx" values="75;130" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="76" r="4" fill="#818cf8" filter="url(#glow-3d)">
      <animate attributeName="cx" values="205;255" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="142" r="4" fill="#00f5a0" filter="url(#glow-3d)">
      <animate attributeName="cx" values="200;75" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
