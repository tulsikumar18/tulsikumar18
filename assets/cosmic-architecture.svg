<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <style>
      .cosmic-stage {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        cursor: pointer;
      }
      .cosmic-stage:hover {
        transform: translateY(-8px) scale(1.1);
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.9));
      }
      .sf-1 { animation: twinkleSF 2.1s ease-in-out infinite alternate; }
      .sf-2 { animation: twinkleSF 3.4s ease-in-out infinite alternate; }
      .sf-3 { animation: twinkleSF 1.7s ease-in-out infinite alternate; }
      @keyframes twinkleSF {
        0% { opacity: 0.15; transform: scale(0.75); }
        50% { opacity: 0.95; transform: scale(1.25); }
        100% { opacity: 0.2; transform: scale(0.8); }
      }

      .m-path-1 { animation: mFlow1 3.5s linear infinite; }
      .m-path-2 { animation: mFlow2 4.2s linear infinite 1.1s; }
      @keyframes mFlow1 {
        0% { x1: 850px; y1: 10px; x2: 960px; y2: -40px; opacity: 0; }
        30% { opacity: 1; }
        100% { x1: 250px; y1: 190px; x2: 360px; y2: 140px; opacity: 0; }
      }
      @keyframes mFlow2 {
        0% { x1: 650px; y1: -10px; x2: 760px; y2: -60px; opacity: 0; }
        30% { opacity: 1; }
        100% { x1: 50px; y1: 170px; x2: 160px; y2: 120px; opacity: 0; }
      }
    </style>

    <radialGradient id="space-arch-bg-dense" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0c193c"/>
      <stop offset="60%" stop-color="#040a1d"/>
      <stop offset="100%" stop-color="#02040b"/>
    </radialGradient>

    <linearGradient id="planet-arc-grad-dense" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02040b" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="meteor-line-dense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="axis-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <filter id="c-glow-dense" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect x="2" y="2" width="896" height="196" rx="14" fill="url(#space-arch-bg-dense)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ==================== DENSE STARFIELD ==================== -->
  <!-- 4-Point Flare Stars -->
  <g transform="translate(180, 25)" class="sf-1">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#ffffff" filter="url(#c-glow-dense)"/>
    <circle cx="0" cy="0" r="2" fill="#7dd3fc"/>
  </g>
  <g transform="translate(740, 30)" class="sf-2">
    <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#38bdf8" filter="url(#c-glow-dense)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Multi-Colored Star Dots -->
  <circle cx="40" cy="20" r="1.5" fill="#38bdf8" class="sf-1"/>
  <circle cx="100" cy="35" r="2.0" fill="#7dd3fc" class="sf-2"/>
  <circle cx="150" cy="15" r="1.2" fill="#ffffff" class="sf-3"/>
  <circle cx="230" cy="40" r="1.8" fill="#fbbf24" class="sf-1"/>
  <circle cx="310" cy="20" r="2.2" fill="#60a5fa" class="sf-2"/>
  <circle cx="390" cy="30" r="1.4" fill="#ffffff" class="sf-3"/>
  <circle cx="470" cy="15" r="2.0" fill="#fbbf24" filter="url(#c-glow-dense)" class="sf-1"/>
  <circle cx="560" cy="35" r="1.6" fill="#7dd3fc" class="sf-2"/>
  <circle cx="640" cy="20" r="2.1" fill="#38bdf8" class="sf-3"/>
  <circle cx="810" cy="25" r="1.7" fill="#fbbf24" class="sf-1"/>
  <circle cx="870" cy="45" r="2.3" fill="#c084fc" filter="url(#c-glow-dense)" class="sf-2"/>

  <!-- Meteors -->
  <line class="m-path-1" stroke="url(#meteor-line-dense)" stroke-width="2" stroke-linecap="round"/>
  <line class="m-path-2" stroke="url(#meteor-line-dense)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Planet Horizon Arc at Bottom -->
  <ellipse cx="450" cy="480" rx="460" ry="300" fill="url(#planet-arc-grad-dense)" filter="url(#c-glow-dense)" opacity="0.85"/>
  <ellipse cx="450" cy="480" rx="450" ry="290" fill="#02040b" stroke="#00f2fe" stroke-width="2"/>

  <!-- Section Title -->
  <text x="30" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">END-TO-END AI / LLM / RAG PIPELINE ENGINE</text>

  <!-- Connecting Pipeline Axis -->
  <path d="M 90 100 L 810 100" stroke="url(#axis-grad)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- 3D Pipeline Stages -->
  <g class="cosmic-stage" transform="translate(90, 100)">
    <circle cx="0" cy="0" r="30" fill="#090d16" stroke="#38bdf8" stroke-width="2" filter="url(#c-glow-dense)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#38bdf8">📄</text>
    <text y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Ingestion</text>
    <text y="60" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PDF, HTML, Audio</text>
  </g>

  <g class="cosmic-stage" transform="translate(270, 100)">
    <circle cx="0" cy="0" r="30" fill="#090d16" stroke="#00f5a0" stroke-width="2" filter="url(#c-glow-dense)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#00f5a0">⚙️</text>
    <text y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00f5a0" text-anchor="middle">2. Parsing</text>
    <text y="60" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">BS4, OCR, OpenCV</text>
  </g>

  <g class="cosmic-stage" transform="translate(450, 100)">
    <circle cx="0" cy="0" r="34" fill="#090d16" stroke="#818cf8" stroke-width="2.5" filter="url(#c-glow-dense)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle" fill="#818cf8">🧠</text>
    <text y="52" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">3. Embeddings</text>
    <text y="64" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FAISS &amp; Neo4j Graph</text>
  </g>

  <g class="cosmic-stage" transform="translate(630, 100)">
    <circle cx="0" cy="0" r="30" fill="#090d16" stroke="#c084fc" stroke-width="2" filter="url(#c-glow-dense)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#c084fc">🤖</text>
    <text y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">4. RAG / LLM</text>
    <text y="60" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FastAPI &amp; Gemini</text>
  </g>

  <g class="cosmic-stage" transform="translate(810, 100)">
    <circle cx="0" cy="0" r="30" fill="#090d16" stroke="#00d2ff" stroke-width="2" filter="url(#c-glow-dense)"/>
    <text cx="0" cy="-4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" fill="#00d2ff">🚀</text>
    <text y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">5. Delivery</text>
    <text y="60" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">JSON, Dash &amp; Push</text>
  </g>

  <circle cx="90" cy="100" r="4.5" fill="#38bdf8" filter="url(#c-glow-dense)">
    <animate attributeName="cx" values="90;270;450;630;810" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
